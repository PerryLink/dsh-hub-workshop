name: 扩展收录申请 / Extension submission
description: 提交由 Author Studio 生成、固定到公开 commit 的扩展清单。
title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: |
        请先在 [Author Studio](https://hub.omdsh.dev/publish.html) 生成完整清单，再粘贴到下方。维护者将用只读校验器建立待审核记录，不执行投稿仓库脚本。普通 Topic 或 Catalog 收录不等于获得 Registry 安装权限。

        Generate a manifest in [Author Studio](https://hub.omdsh.dev/publish.html), then paste it below. A maintainer uses the read-only validator to create a pending-review record without executing submitted repository scripts. Topic or Catalog inclusion does not grant Registry installation authority.
  - type: textarea
    id: submission_manifest
    attributes:
      label: Author Studio manifest
      description: 请粘贴完整的 omdsh-workshop-submission/v1 JSON；不要包含 Token、密钥、个人路径或私有配置。
      placeholder: |
        {
          "schema": "omdsh-workshop-submission/v1",
          "operation": "create-project"
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: 补充说明 / Additional context
      description: 可选。填写清单无法表达、但审核时需要知道的公开边界。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认 / Confirmations
      options:
        - label: 我确认清单不包含 Token、密钥、个人路径、私有配置或其他敏感信息。
          required: true
        - label: 我确认安装说明与固定 commit 一致，并允许维护者读取该公开版本源码。
          required: true
        - label: 我理解提交与收录不代表安全背书、自动启用或安装权限。
          required: true
        - label: 我理解“事务安装、配置安装、引导接入”是三种接入类型，“待审核”是独立状态；只有当前官方基线验证与人工审核均通过的受支持类型才可能进入 Registry。
          required: true
