name: 扩展收录申请 / Extension submission
description: 提交由作者 Agent 或 Author Studio 生成、固定到公开 commit 的扩展清单。
title: "[Submission] "
body:
  - type: markdown
    attributes:
      value: |
        推荐把[标准自动投稿指令](https://hub.omdsh.dev/agent-submission-prompt.zh.md)交给作者 Agent；也可从 [Author Studio](https://hub.omdsh.dev/publish.html) 打开此表单。Issue 创建后，自动化只读核验公开仓库、固定 commit 和声明路径，并建立待审核 PR；不会执行投稿仓库脚本。普通 Topic 或 Catalog 收录不等于获得 Registry 安装权限。

        Give the [standard submission instruction](https://hub.omdsh.dev/agent-submission-prompt.en.md) to the author's Agent, or use [Author Studio](https://hub.omdsh.dev/publish.html) as a manual fallback. After the Issue is created, automation checks the public repository, fixed commit, and declared path read-only and opens a pending-review PR without executing submitted repository scripts. Topic or Catalog inclusion does not grant Registry installation authority.
  - type: textarea
    id: submission_manifest
    attributes:
      label: Author Studio manifest
      description: 请粘贴完整的 omdsh-workshop-submission/v2 JSON；packageManifest 必须与固定 commit 中的 package.json#dshWorkshop 一致。不要包含 Token、密钥、个人路径或私有配置。
      placeholder: |
        {
          "schema": "omdsh-workshop-submission/v2",
          "operation": "create-project",
          "packageManifest": { "schema": "omdsh-workshop-package/v1", "type": "plugin" }
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: 补充说明 / Additional context
      description: 可选。填写清单无法表达、但审核时需要知道的公开边界。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认 / Confirmations
      options:
        - label: 我确认清单不包含 Token、密钥、个人路径、私有配置或其他敏感信息。
          required: true
        - label: 我确认安装说明与固定 commit 一致，并允许维护者读取该公开版本源码。
          required: true
        - label: 我理解提交与收录不代表安全背书、自动启用或安装权限。
          required: true
        - label: 我理解“事务安装、配置安装、引导接入”是三种接入类型，“待审核”是独立状态；只有当前官方基线验证与人工审核均通过的受支持类型才可能进入 Registry。
          required: true
